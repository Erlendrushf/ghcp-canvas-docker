<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">🐳</span>
        <strong>Docker</strong>
        <span id="target" class="pill muted">connecting…</span>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="containers">Containers</button>
        <button role="tab" data-view="images">Images</button>
        <button role="tab" data-view="compose">Compose</button>
        <button role="tab" data-view="activity">Activity <span id="approval-badge" class="badge" hidden></span></button>
      </nav>
    </header>

    <div id="banner" class="banner" hidden></div>
    <section id="approvals" class="approvals" aria-live="polite"></section>

    <main>
      <section id="view-containers" class="view">
        <div class="toolbar">
          <label class="check"><input type="checkbox" id="show-all" checked /> Show stopped</label>
          <input type="search" id="container-filter" placeholder="Filter by name or image" />
          <span class="spacer"></span>
          <button id="toggle-run" class="primary">Run container…</button>
        </div>
        <form id="run-form" class="card form" hidden>
          <h3>Run a container</h3>
          <div class="grid">
            <label>Image <input name="image" required placeholder="nginx:alpine" autocomplete="off" /></label>
            <label>Name <input name="name" placeholder="optional" autocomplete="off" /></label>
            <label>Ports <input name="ports" placeholder="8080:80, 5432:5432/tcp" autocomplete="off" /></label>
            <label>Command <input name="command" placeholder="optional, e.g. sleep 3600" autocomplete="off" /></label>
            <label class="wide">Environment <textarea name="env" rows="2" placeholder="KEY=value (one per line)"></textarea></label>
            <label class="wide">Bind mounts <textarea name="mounts" rows="2" placeholder="/abs/host/path:/container/path[:ro] (one per line)"></textarea></label>
          </div>
          <div class="row">
            <label class="check"><input type="checkbox" name="autoRemove" /> Remove when stopped</label>
            <label class="check"><input type="checkbox" name="exposeAll" /> Publish on all interfaces (0.0.0.0)</label>
            <span class="spacer"></span>
            <button type="button" data-close>Cancel</button>
            <button type="submit" class="primary">Run</button>
          </div>
          <p class="hint">Ports bind to 127.0.0.1 unless you choose otherwise. Ports and mounts require confirmation.</p>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Container</th><th>State</th><th>Ports</th><th>CPU / Mem</th><th class="actions-col"></th></tr>
            </thead>
            <tbody id="containers"></tbody>
          </table>
          <p id="containers-empty" class="empty" hidden>No containers.</p>
        </div>
      </section>

      <section id="view-images" class="view" hidden>
        <form id="pull-form" class="toolbar">
          <input name="image" placeholder="Image to pull, e.g. redis:7-alpine" required autocomplete="off" />
          <button type="submit" class="primary">Pull</button>
          <span class="spacer"></span>
          <input type="search" id="image-filter" placeholder="Filter images" />
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Image</th><th>ID</th><th>Size</th><th class="actions-col"></th></tr></thead>
            <tbody id="images"></tbody>
          </table>
          <p id="images-empty" class="empty" hidden>No images.</p>
        </div>
      </section>

      <section id="view-compose" class="view" hidden>
        <form id="compose-form" class="card form">
          <div class="grid">
            <label class="wide">Project directory <input name="projectDir" required placeholder="/absolute/path/to/project" autocomplete="off" /></label>
            <label>Compose files <input name="files" placeholder="optional: compose.yaml, compose.dev.yaml" autocomplete="off" /></label>
            <label>Project name <input name="projectName" placeholder="optional" autocomplete="off" /></label>
          </div>
          <div class="row">
            <button type="button" data-compose="compose_config">Inspect</button>
            <button type="button" data-compose="compose_ps">Status</button>
            <span class="spacer"></span>
            <label class="check"><input type="checkbox" name="build" /> Build</label>
            <label class="check"><input type="checkbox" name="wait" checked /> Wait for healthy</label>
            <button type="button" class="primary" data-compose="compose_up">Up</button>
            <label class="check"><input type="checkbox" name="removeVolumes" /> Delete volumes</label>
            <button type="button" class="danger" data-compose="compose_down">Down</button>
          </div>
        </form>
        <div id="compose-output"></div>
      </section>

      <section id="view-activity" class="view" hidden>
        <h3>Operations</h3>
        <div id="operations"></div>
        <h3>Approval history</h3>
        <div id="approval-history"></div>
      </section>
    </main>

    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-head">
        <strong id="drawer-title"></strong>
        <span class="spacer"></span>
        <label class="check" id="follow-wrap"><input type="checkbox" id="drawer-follow" checked /> Auto-scroll</label>
        <button id="drawer-close" aria-label="Close">✕</button>
      </div>
      <pre id="drawer-body"></pre>
    </aside>

    <div id="toast" class="toast" hidden role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
